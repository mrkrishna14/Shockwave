name: Stripe demo integration
on:
  pull_request:
  push:
    branches: [Sai]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: demo/stripe-checkout/package-lock.json
      - run: python -m pip install -r requirements-integration.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix demo/stripe-checkout
      - run: python -m pytest -q
      - run: python -m migration.stripe_demo
        env:
          PYTHONPATH: app
