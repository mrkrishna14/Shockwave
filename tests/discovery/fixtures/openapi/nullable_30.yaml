# OpenAPI 3.0 fixture (data only): `nullable` and allOf-wrapped refs. info.version is
# deliberately an unquoted date, which YAML would otherwise turn into a date object.
openapi: 3.0.0
info:
  title: Nullable 3.0 (test fixture)
  version: 2024-01-01
paths:
  /widgets/{id}:
    get:
      operationId: getWidget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: A widget.
          content:
            application/json:
              schema:
                type: object
                properties:
                  note:
                    type: string
                    nullable: true
                  parent:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/Widget'
components:
  schemas:
    Widget:
      type: object
      properties:
        id:
          type: string
